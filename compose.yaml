# Local stack; add --profile tunnel to connect Cloudflare. See docs/DEPLOYMENT.md.
name: communi

services:
  ckw-engine:
    build:
      context: ./services/ckw-engine
    restart: unless-stopped
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-development}
      COMMUNI_RELEASE: ${COMMUNI_RELEASE:-communi@0.2.0}
      CKW_INTERNAL_TOKEN_FILE: /run/communi/internal_token
      CKW_TMP_DIR: /tmp/communi-ckw
      TMPDIR: /tmp/communi-ckw
      CKW_PV_PLANT_CACHE_PATH: /tmp/communi-ckw/public-data/electricity-production-plants.csv
    volumes:
      - internal-secrets:/run/communi
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import Request,urlopen; from pathlib import Path; urlopen(Request('http://127.0.0.1:8000/internal/health', headers={'Authorization': 'Bearer '+Path('/run/communi/internal_token').read_text().strip()}), timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    tmpfs:
      - /tmp/communi-ckw:size=512m,mode=0700
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [private, egress]

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-development}
      COMMUNI_RELEASE: ${COMMUNI_RELEASE:-communi@0.2.0}
      DATA_DIR: /data
      DATABASE_URL: sqlite:///data/communi.sqlite
      HOST: 0.0.0.0
      PORT: 4100
      CORS_ORIGINS: ${CORS_ORIGINS:-https://communi.ch,https://www.communi.ch,https://ckw.communi.ch}
      MAX_CSV_BYTES: ${MAX_CSV_BYTES:-10485760}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10485760}
      GUEST_SESSION_MAX_BYTES: ${GUEST_SESSION_MAX_BYTES:-52428800}
      REGISTERED_USER_MAX_BYTES: ${REGISTERED_USER_MAX_BYTES:-1073741824}
      GUEST_IDLE_MINUTES: ${GUEST_IDLE_MINUTES:-60}
      GUEST_MAX_HOURS: ${GUEST_MAX_HOURS:-24}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-300}
      GUEST_TMP_DIR: /tmp/communi-guests
      CKW_COOKIE_SECURE: ${CKW_COOKIE_SECURE:-true}
      AUTH0_AUDIENCE: ${PUBLIC_AUTH0_AUDIENCE:-https://api.communi.ch}
      AUTH0_ISSUER_BASE_URL: https://${PUBLIC_AUTH0_DOMAIN:?set PUBLIC_AUTH0_DOMAIN}/
      CKW_ENGINE_URL: http://ckw-engine:8000
      CKW_INTERNAL_TOKEN_FILE: /run/communi/internal_token
      RUST_LOG: ${RUST_LOG:-communi_backend_api=info,tower_http=info}
    volumes:
      - communi-data:/data
      - internal-secrets:/run/communi:ro
    tmpfs:
      - /tmp/communi-guests:size=256m,mode=0700
    depends_on:
      ckw-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4100/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [private, egress]

  gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
      args:
        PUBLIC_AUTH0_DOMAIN: ${PUBLIC_AUTH0_DOMAIN:?set PUBLIC_AUTH0_DOMAIN in Portainer}
        PUBLIC_AUTH0_CLIENT_ID: ${PUBLIC_AUTH0_CLIENT_ID:?set PUBLIC_AUTH0_CLIENT_ID in Portainer}
        PUBLIC_AUTH0_AUDIENCE: ${PUBLIC_AUTH0_AUDIENCE:-https://api.communi.ch}
        PUBLIC_AUTH0_REDIRECT_URI: ${PUBLIC_AUTH0_REDIRECT_URI:-https://communi.ch/raum/}
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    environment:
      PUBLIC_AUTH0_DOMAIN: ${PUBLIC_AUTH0_DOMAIN}
      PUBLIC_AUTH0_CLIENT_ID: ${PUBLIC_AUTH0_CLIENT_ID}
      PUBLIC_AUTH0_AUDIENCE: ${PUBLIC_AUTH0_AUDIENCE:-https://api.communi.ch}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-development}
      COMMUNI_RELEASE: ${COMMUNI_RELEASE:-communi@0.2.0}
      PUBLIC_CKW_MEMBER_URL: ${PUBLIC_CKW_PORTAL_URL:-https://communi.ch/raum/ckw/}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks: [private, edge]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.8.2}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    profiles: [tunnel]
    networks: [edge]

networks:
  private:
    internal: true
  edge:
  egress:

volumes:
  communi-data:
  internal-secrets:
