server {
    listen 8080 default_server;
    server_name communi.ch www.communi.ch localhost 127.0.0.1;
    server_tokens off;
    root /usr/share/nginx/html/site;
    index index.html;
    client_max_body_size 52m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fixed GlitchTip destination: no caller-controlled proxy target. Do not
    # forward visitor credentials, IP, user agent or referrer to error tracking.
    location = /telemetry/envelope {
        limit_except POST { deny all; }
        client_max_body_size 256k;
        proxy_pass https://errors.bsdata.ch/api/4/envelope/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_set_header Content-Type application/x-sentry-envelope;
        proxy_set_header X-Sentry-Auth "Sentry sentry_version=7, sentry_key=18f8f87fadfa44999074ec24ac125884";
        proxy_set_header Host errors.bsdata.ch;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_set_header User-Agent "Communi error relay";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    location = /health/live { access_log off; return 200 "ok\n"; }
    location = /communi-config.js {
        alias /var/run/communi-config.js;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /raum/ckw { return 308 /raum/ckw/; }
    location /raum/ckw/ {
        root /usr/share/nginx/html;
        try_files /ckw/index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location /assets/ {
        alias /usr/share/nginx/html/ckw/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location ~ ^/(api|v1|health)/ {
        proxy_pass http://api:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 200s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location / { try_files $uri $uri/ $uri.html =404; }
}

