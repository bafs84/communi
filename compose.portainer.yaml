# Standalone Portainer stack: deploy this file by itself, not as an override.
# Set variables in Portainer; see docs/PORTAINER.md.
name: communi

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-communi}
      POSTGRES_USER: ${POSTGRES_USER:-communi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-communi} -d ${POSTGRES_DB:-communi}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]

  garage:
    build:
      context: ./infra/garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in Portainer}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in Portainer}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in Portainer}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-communi-private}
      GARAGE_NODE_CAPACITY: ${GARAGE_NODE_CAPACITY:-100GB}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage-healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [private]

  migrate:
    build:
      context: ./services/api
      dockerfile: Dockerfile.migrate
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -ec
      - >-
        psql -h postgres -U ${POSTGRES_USER:-communi} -d ${POSTGRES_DB:-communi}
        -v ON_ERROR_STOP=1 -f /migrations/001_initial.sql
        && psql -h postgres -U ${POSTGRES_USER:-communi} -d ${POSTGRES_DB:-communi}
        -v ON_ERROR_STOP=1 -f /migrations/002_ckw_tools.sql
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  ckw-engine:
    build:
      context: ./services/ckw-engine
    restart: unless-stopped
    environment:
      CKW_INTERNAL_TOKEN: ${CKW_INTERNAL_TOKEN:?set CKW_INTERNAL_TOKEN in Portainer}
      CKW_TMP_DIR: /tmp/communi-ckw
      CKW_PV_PLANT_CACHE_PATH: /tmp/communi-ckw/public-data/electricity-production-plants.csv
    tmpfs:
      - /tmp/communi-ckw:size=512m,mode=0700
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [private, egress]

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-communi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-communi}
      HOST: 0.0.0.0
      PORT: 4100
      CORS_ORIGINS: ${CORS_ORIGINS:-https://communi.ch,https://www.communi.ch,https://ckw.communi.ch}
      MAX_CSV_BYTES: ${MAX_CSV_BYTES:-10485760}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-10485760}
      GUEST_SESSION_MAX_BYTES: ${GUEST_SESSION_MAX_BYTES:-52428800}
      REGISTERED_USER_MAX_BYTES: ${REGISTERED_USER_MAX_BYTES:-1073741824}
      GUEST_IDLE_MINUTES: ${GUEST_IDLE_MINUTES:-60}
      GUEST_MAX_HOURS: ${GUEST_MAX_HOURS:-24}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-300}
      GUEST_TMP_DIR: /tmp/communi-guests
      CKW_COOKIE_SECURE: ${CKW_COOKIE_SECURE:-true}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in Portainer}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL:?set AUTH0_ISSUER_BASE_URL in Portainer}
      CKW_ENGINE_URL: http://ckw-engine:8000
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-communi-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in Portainer}
      CKW_INTERNAL_TOKEN: ${CKW_INTERNAL_TOKEN:?set CKW_INTERNAL_TOKEN in Portainer}
      RUST_LOG: ${RUST_LOG:-communi_backend_api=info,tower_http=info}
    tmpfs:
      - /tmp/communi-guests:size=256m,mode=0700
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
      ckw-engine:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4100/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [private, egress]

  gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
      args:
        PUBLIC_AUTH0_DOMAIN: ${PUBLIC_AUTH0_DOMAIN:?set PUBLIC_AUTH0_DOMAIN in Portainer}
        PUBLIC_AUTH0_CLIENT_ID: ${PUBLIC_AUTH0_CLIENT_ID:?set PUBLIC_AUTH0_CLIENT_ID in Portainer}
        PUBLIC_AUTH0_AUDIENCE: ${PUBLIC_AUTH0_AUDIENCE:?set PUBLIC_AUTH0_AUDIENCE in Portainer}
        PUBLIC_AUTH0_REDIRECT_URI: ${PUBLIC_AUTH0_REDIRECT_URI:-https://communi.ch/raum/}
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    environment:
      PUBLIC_AUTH0_DOMAIN: ${PUBLIC_AUTH0_DOMAIN}
      PUBLIC_AUTH0_CLIENT_ID: ${PUBLIC_AUTH0_CLIENT_ID}
      PUBLIC_AUTH0_AUDIENCE: ${PUBLIC_AUTH0_AUDIENCE}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PUBLIC_CKW_MEMBER_URL: ${PUBLIC_CKW_PORTAL_URL:-https://communi.ch/raum/ckw/}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    networks: [private, edge]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.8.2}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?set CLOUDFLARED_TUNNEL_TOKEN in Portainer}
    depends_on:
      gateway:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [edge]

networks:
  private:
    internal: true
  edge:
  egress:

volumes:
  postgres-data:
  garage-meta:
  garage-data:
