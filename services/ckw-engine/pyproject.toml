[project]
name = "ckw-script"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "docxtpl>=0.20.0",
  "fastapi>=0.115.0",
  "numpy>=2.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pillow>=10.0.0",
  "pydantic-settings>=2.6.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
ckw = "ckw_script.cli:main"
ckw-invoices = "ckw_script.vzev_invoice_documents:main"
ckw-overview = "ckw_script.vzev_operator_overview:main"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ckw_script"]
